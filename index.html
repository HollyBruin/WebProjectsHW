<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportiva - Advanced Hero Area with Network Globe</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        .hero-container {
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1e 50%, #000000 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .network-globe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><radialGradient id="globe" cx="50%" cy="30%" r="70%"><stop offset="0%" style="stop-color:%23ffffff;stop-opacity:0.1"/><stop offset="100%" style="stop-color:%23000000;stop-opacity:0.8"/></radialGradient></defs><circle cx="150" cy="150" r="140" fill="url(%23globe)" stroke="%23ffffff" stroke-width="1" opacity="0.3"/><g stroke="%23ffffff" stroke-width="0.5" opacity="0.4" fill="none"><path d="M10,150 Q150,50 290,150 Q150,250 10,150"/><path d="M150,10 Q250,150 150,290 Q50,150 150,10"/><path d="M30,80 Q150,120 270,80"/><path d="M30,220 Q150,180 270,220"/><path d="M80,30 Q120,150 80,270"/><path d="M220,30 Q180,150 220,270"/></g></svg>') center/contain no-repeat;
            animation: rotateGlobe 20s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }
        
        .network-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, transparent 40%, rgba(59, 130, 246, 0.1) 70%);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
            z-index: 0;
        }
        
        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
        }
        
        .main-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            line-height: 1.1;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .description-text {
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            color: #e2e8f0;
            line-height: 1.7;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }
        
        .primary-button {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .primary-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.4);
        }
        
        .primary-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .primary-button:hover::before {
            left: 100%;
        }
        
        .secondary-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .secondary-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }
        
        @keyframes rotateGlobe {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.1; }
        }
        
        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .network-globe {
                width: 400px;
                height: 400px;
            }
            
            .network-overlay {
                width: 500px;
                height: 500px;
            }
            
            .buttons-container {
                flex-direction: column;
            }
            
            .primary-button, .secondary-button {
                width: 100%;
                max-width: 300px;
            }
        }
        
        @media (max-width: 480px) {
            .network-globe {
                width: 300px;
                height: 300px;
            }
            
            .network-overlay {
                width: 400px;
                height: 400px;
            }
        }
        
        /* Network connection lines animation */
        .connection-lines {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            z-index: 1;
            opacity: 0.4;
        }
        
        .connection-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            height: 1px;
            animation: connectionPulse 3s ease-in-out infinite;
        }
        
        @keyframes connectionPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <!-- Network Globe Background -->
        <div class="network-overlay"></div>
        <div class="network-globe"></div>
        
        <!-- Connection Lines -->
        <div class="connection-lines">
            <div class="connection-line" style="top: 30%; width: 200px; left: 20%; animation-delay: 0s;"></div>
            <div class="connection-line" style="top: 70%; width: 150px; right: 15%; animation-delay: 1s;"></div>
            <div class="connection-line" style="top: 50%; width: 180px; left: 10%; animation-delay: 2s;"></div>
        </div>
        
        <!-- Floating Particles -->
        <div class="floating-particles">
            <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
            <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
            <div class="particle" style="left: 30%; animation-delay: 4s;"></div>
            <div class="particle" style="left: 40%; animation-delay: 6s;"></div>
            <div class="particle" style="left: 50%; animation-delay: 8s;"></div>
            <div class="particle" style="left: 60%; animation-delay: 10s;"></div>
            <div class="particle" style="left: 70%; animation-delay: 12s;"></div>
            <div class="particle" style="left: 80%; animation-delay: 14s;"></div>
            <div class="particle" style="left: 90%; animation-delay: 16s;"></div>
        </div>
        
        <!-- Content -->
        <div class="content-wrapper">
            <h1 class="main-title">
                Markanızı Dünya Pazarına Taşıyoruz
            </h1>
            
            <p class="description-text">
                İhracata yönelik Dijital Dönüşüm, Profesyonel İhracat Danışmanlığı ve AI destekli çözümlerle firmanızın globalde büyümesine rehberlik ediyoruz.
            </p>
            
            <div class="buttons-container">
                <a href="https://exportiva.net/ucretsiz-pazar-danismanligi/" class="primary-button">
                    <i class="fas fa-rocket mr-2"></i>
                    Ücretsiz Danışmanlık Al
                </a>
                
                <a href="tel:+903129220642" class="secondary-button">
                    <i class="fas fa-phone mr-2"></i>
                    Hemen Ara
                </a>
            </div>
        </div>
    </div>

    <!-- Demo content to test scrolling -->
    <div style="height: 100vh; background: linear-gradient(180deg, #000000 0%, #1a1a2e 100%); display: flex; align-items: center; justify-content: center;">
        <div style="text-align: center; color: white;">
            <h2 style="font-size: 2rem; margin-bottom: 1rem;">Scroll Test Section</h2>
            <p style="font-size: 1.2rem; color: #e2e8f0;">Bu bölüm scroll işlevinin çalıştığını test etmek için eklendi.</p>
        </div>
    </div>

    <script>
        // Enhanced globe rotation with mouse interaction
        document.addEventListener('DOMContentLoaded', function() {
            const globe = document.querySelector('.network-globe');
            const heroContainer = document.querySelector('.hero-container');
            let mouseX = 0;
            let mouseY = 0;
            
            heroContainer.addEventListener('mousemove', function(e) {
                mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                mouseY = (e.clientY / window.innerHeight) * 2 - 1;
                
                globe.style.transform = `translate(-50%, -50%) rotate(${mouseX * 10}deg) rotateY(${mouseY * 10}deg)`;
            });
            
            heroContainer.addEventListener('mouseleave', function() {
                globe.style.transform = 'translate(-50%, -50%) rotate(0deg)';
            });
            
            // Dynamic particle creation
            function createParticle() {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                
                document.querySelector('.floating-particles').appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 25000);
            }
            
            // Create particles periodically
            setInterval(createParticle, 2000);
            
            // Smooth scroll for buttons
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
